# PL-775 — віддача статики лендингу.
# Головне тут — політика кешу: файли в /assets/ мають хеш у назві й кешуються
# назавжди, а index.html кешувати НЕ можна, інакше правка тексту не дійде до
# відвідувача, який уже був на сайті.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # ^~ (а не звичайний префікс), щоб regex-локації нижче не перехопили
    # картинки та шрифти, які лежать усередині /assets/.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Шрифти й картинки з public/ хеша в назві не мають — кешуємо помірно,
    # щоб заміна файлу дійшла до людей за розумний час.
    location ~* \.(woff2|woff|ttf|otf)$ {
        add_header Cache-Control "public, max-age=2592000";
    }
    location ~* \.(png|jpe?g|webp|gif|svg|ico)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    # SPA-rewrite не потрібен — сторінка одна.
    location / {
        try_files $uri $uri/ =404;
    }
}
